# Deploy otomatis backend Supabase (Edge Function `api`) setiap kali isi supabase/functions/
# berubah di branch mergesemua. Yang di-deploy selalu isi branch itu, bukan laptop seseorang,
# jadi perubahan teman tidak bisa saling timpa.
#
# Butuh satu rahasia di repo (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  token dari supabase.com > Account > Access Tokens
#
# Perubahan tabel (supabase/schema.sql) TIDAK dijalankan di sini; itu tetap manual.
name: Deploy backend Supabase

on:
  push:
    branches: [mergesemua]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  PROJECT_REF: zejaqgqpyrjvlarnxyaq

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek rahasia
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Rahasia SUPABASE_ACCESS_TOKEN belum dipasang di Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Tolak kode yang tidak lolos pengecekan tipe sebelum menyentuh server.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cek tipe
        working-directory: supabase/functions/api
        run: deno check index.ts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes

      - name: Cek hidup setelah deploy
        run: |
          sleep 8
          curl -fsS "https://$PROJECT_REF.supabase.co/functions/v1/api" | tee /dev/stderr | grep -q '"success":true'
          curl -fsS "https://$PROJECT_REF.supabase.co/functions/v1/api" -H 'Content-Type: text/plain' \
            -d '{"action":"verify-session","token":"ping"}' | grep -q '"success"'
          echo "Backend aktif."
