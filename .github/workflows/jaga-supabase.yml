# Supabase gratis menjeda project yang tidak ada aktivitas 7 hari.
# Workflow ini memanggil API (yang membaca database) tiap 3 hari supaya project tetap aktif.
name: Jaga Supabase tetap aktif

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil API dan baca database
        run: |
          set -e
          S=https://zejaqgqpyrjvlarnxyaq.supabase.co/functions/v1/api
          curl -fsS "$S" -H 'Content-Type: text/plain' -d '{"action":"verify-session","token":"ping"}' | tee /dev/stderr | grep -q '"success"'
          echo "Supabase aktif"
